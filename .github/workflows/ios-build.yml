# Ndërton .ipa drejtpërdrejt në GitHub Actions (macOS runner), pa Xcode Cloud.
# Gjeneron projektin Xcode në fluturim (`tauri ios init --ci`) — nuk e commit-on,
# ndryshe nga ios-init.yml (i cili ekziston veç e veç për rrugën Xcode Cloud).
#
# Kërkon 3 GitHub Secrets (Settings → Secrets and variables → Actions):
#   IOS_CERTIFICATE           base64 i certifikatës "Apple Distribution" (.p12)
#   IOS_CERTIFICATE_PASSWORD  fjalëkalimi i vendosur kur u eksportua .p12-ja
#   IOS_MOBILE_PROVISION      base64 i provisioning profile-it (.mobileprovision)
#                             për bundle id "com.mjeku.desktop"
# Nëse mjeku-ui është repo privat, duhet edhe:
#   MJEKU_UI_TOKEN            PAT me lexim te kasystem/mjeku-ui
#
# Për ngarkim automatik në TestFlight (kur export_method = app-store-connect):
#   APP_STORE_CONNECT_KEY_ID       Key ID nga App Store Connect → Users and Access → Integrations
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID (i njëjti për të gjithë çelësat)
#   APP_STORE_CONNECT_API_KEY_P8   base64 i skedarit AuthKey_<KEYID>.p8 (shkarkohet 1 herë)
#
# Si të prodhosh vlerat base64 (macOS/Linux): base64 -i Certificate.p12 | pbcopy
# Si të prodhosh vlerat base64 (Windows PowerShell):
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("Certificate.p12")) | Set-Clipboard
#
# KUJDES: .p12-ja duhet eksportuar me `openssl pkcs12 -export -legacy ...` (jo formatin
# modern AES të OpenSSL 3.x) — përndryshe `security import` në macOS dështon me
# "MAC verification failed" edhe kur fjalëkalimi është korrekt.
#
# Nisja: GitHub → Actions → "iOS build (.ipa)" → Run workflow
#
# TRIGGER I PLANIFIKUAR (schedule): rindërton dhe ringarkon vetvetiu në TestFlight çdo muaj
# (1 herë/muaj, shumë brenda margjinës së skadimit 90-ditor të TestFlight) — kjo mban
# gjallë distribuimin External TestFlight pa ndërprerje edhe pse Mjeku s'është ende në
# App Store publik (i bllokuar nga Guideline 5.1.1(ix)/3.2, gusht 2026 — kërkon llogari
# Organization, jo Individual). Në rrugën e planifikuar: rrit vetë versionin (patch+1) dhe
# e commit-on ndryshimin, e forcon export_method=app-store-connect, dhe hap një GitHub
# Issue nëse dështon diçka — pasi dështim i heshtur këtu do të thotë të gjitha klinikat
# humbasin qasje njëkohësisht pas 90 ditësh pa dijeninë e askujt.
name: iOS build (.ipa)

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Metoda e exportit"
        required: false
        default: "release-testing"
        type: choice
        options:
          - release-testing
          - app-store-connect
          - debugging
      simulate_schedule:
        description: "Simulo rrugen e planifikuar (TestFlight refresh - rrit versionin dhe ngarkon si te ishte cron-i mujor)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write
  issues: write

jobs:
  ios-build:
    runs-on: macos-15
    steps:
      # Apple kerkon SDK iOS 26+ (Xcode 26+) per te ngarkuar ne App Store Connect —
      # macos-15 runner e ka Xcode 16.4 si default, por Xcode 26.x eshte i instaluar
      # gjithashtu (thjesht jo i zgjedhur). E zgjedhim eksplicit.
      - name: Zgjidh Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcode-select -p

      - name: Checkout mjeku-desktop
        uses: actions/checkout@v4
        with:
          path: mjeku-desktop
          token: ${{ secrets.GITHUB_TOKEN }}

      # Rruga e planifikuar (schedule) e vetme: rrit versionin patch (0.5.13 -> 0.5.14) dhe
      # e commit-on direkt ne main, keshtu qe build-i i ri qe ngarkohet ka nje CFBundleVersion
      # unik (Apple s'lejon ringarkim te te njejtit numer versioni). Nisjet manuale
      # (workflow_dispatch) s'e prekin versionin fare.
      - name: Rrit versionin (vetëm rruga e planifikuar - TestFlight refresh)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.simulate_schedule == 'true' }}
        working-directory: mjeku-desktop
        run: |
          set -e
          CONF="src-tauri/tauri.conf.json"
          CURRENT=$(node -p "require('./$CONF').version")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Version: $CURRENT -> $NEXT"
          node -e "
            const fs = require('fs');
            const p = '$CONF';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '$NEXT';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CONF"
          git commit -m "chore: bump version $CURRENT -> $NEXT (automated TestFlight refresh)"
          git push origin HEAD:main

      - name: Checkout mjeku-ui (repo simotër)
        uses: actions/checkout@v4
        with:
          repository: kasystem/mjeku-ui
          token: ${{ secrets.MJEKU_UI_TOKEN || github.token }}
          path: mjeku-ui

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust + iOS targets
        run: |
          rustup update stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Instalimi i varësive
        run: |
          cd mjeku-ui && npm ci
          cd ../mjeku-desktop && npm ci

      - name: Build UI + seed (kërkohet nga tauri.conf beforeBuild)
        run: |
          cd mjeku-ui && npm run build
          cd ../mjeku-desktop && node scripts/prepare_ui_seed.mjs

      - name: tauri ios init
        working-directory: mjeku-desktop
        env:
          APPLE_DEVELOPMENT_TEAM: "79HPB8A463"
        run: npx tauri ios init --ci

      - name: Shto lejet Camera/Photo Library + File Sharing te Info.plist
        run: bash mjeku-desktop/ci_scripts/patch_ios_plist.sh mjeku-desktop/src-tauri/gen/apple

      # Tauri s'e instalon vete IOS_MOBILE_PROVISION te dosja e sistemit — pa kete
      # hap, xcodebuild dështon me "requires a provisioning profile" edhe pse
      # certifikata dhe Team ID jane korrekte.
      - name: Instalo provisioning profile
        env:
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_MOBILE_PROVISION" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/mjeku.mobileprovision
          echo "Profili u instalua:"
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/mjeku.mobileprovision | grep -A1 "UUID\|application-identifier\|<key>Name"

      # `tauri ios build -- ARGS` i kalon argumentet te cargo, JO te xcodebuild — pra
      # CODE_SIGN_STYLE/PROVISIONING_PROFILE_SPECIFIER s'mund t'i kalojme si CLI args.
      # Modifikojme direkt .xcodeproj-in e gjeneruar (permes gem-it Ruby `xcodeproj`,
      # i disponueshem nga CocoaPods) qe te detyroje Manual signing per te gjitha
      # target-et/config-et — keshtu Tauri vete e perdor kete kur therret xcodebuild.
      - name: Detyro Manual code signing ne .xcodeproj
        run: |
          gem list -i xcodeproj || gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            path = "mjeku-desktop/src-tauri/gen/apple/mjeku_desktop.xcodeproj"
            project = Xcodeproj::Project.open(path)
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["DEVELOPMENT_TEAM"] = "79HPB8A463"
                config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = "Mjeku App Store"
                config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                config.build_settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
                # iPhone-only (jo Universal) - shmang kerkesen e Apple per screenshot 13" iPad
                config.build_settings["TARGETED_DEVICE_FAMILY"] = "1"
              end
            end
            project.save
            puts "Signing i detyruar (Manual) per #{project.targets.map(&:name).join(", ")}"
          '

      - name: tauri ios build (.ipa)
        working-directory: mjeku-desktop
        env:
          CI: true
          APPLE_DEVELOPMENT_TEAM: "79HPB8A463"
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: >
          npx tauri ios build --ci --target aarch64
          --export-method ${{ (github.event_name == 'schedule' || github.event.inputs.simulate_schedule == 'true') && 'app-store-connect' || github.event.inputs.export_method || 'release-testing' }}

      - name: Ngarko .ipa si artifact
        uses: actions/upload-artifact@v4
        with:
          name: mjeku-ios-ipa
          path: mjeku-desktop/src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error

      # Vetem kur eksportohet per App Store Connect (jo per release-testing/debugging
      # lokal) — ngarkon .ipa-ne direkt ne TestFlight permes App Store Connect API,
      # pa Mac/Transporter. Kerkon 3 GitHub Secrets: APP_STORE_CONNECT_KEY_ID,
      # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8 (base64 i .p8).
      - name: Ngarko ne TestFlight (App Store Connect)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.simulate_schedule == 'true' || github.event.inputs.export_method == 'app-store-connect' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          IPA_PATH=$(find mjeku-desktop/src-tauri/gen/apple/build/arm64 -name "*.ipa" | head -1)
          echo "Duke ngarkuar: $IPA_PATH"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      # Vetem rruga e planifikuar: dashtim i heshtur ketu do te thote qe brenda 90 ditesh
      # TE GJITHA klinikat humbasin qasje njekohesisht (build-i TestFlight skadon) pa
      # dijenine e askujt, prandaj hapim nje GitHub Issue te dukshem ne vend qe te mbeshtetemi
      # vetem te email-i default i GitHub-it per workflow-e te deshtuara.
      - name: Njofto deshtimin (vetem rruga e planifikuar)
        if: ${{ failure() && (github.event_name == 'schedule' || github.event.inputs.simulate_schedule == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="Build-i mujor automatik i planifikuar per Mjeku (TestFlight refresh) deshtoi.\n\nRun: ${RUN_URL}\n\nURGJENT: nese kjo s'zgjidhet perpara skadimit 90-ditor te build-it te fundit ne TestFlight, TE GJITHA klinikat do te humbasin qasje ne app te njekohesisht. Kontrollo logun e run-it me lart per shkakun (certifikate e skaduar, provisioning profile, credential-e te App Store Connect, etj.) dhe rindiz workflow-in manualisht pasi te rregullohet."
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "iOS TestFlight refresh DESHTOI - $(date -u +%Y-%m-%d)" \
            --body "$(printf '%b' "$BODY")"
